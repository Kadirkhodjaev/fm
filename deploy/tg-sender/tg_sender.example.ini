; MedOnline tg-sender settings. Copy to tg_sender.ini next to sender.py and fill in.
; tg_sender.ini and the clinic.session file are secrets: do not commit them, do not send them in chats.
[sender]
; from my.telegram.org -> API development tools (account of the clinic number)
api_id = 0
api_hash = put_api_hash_here
; clinic Telegram number
phone = +998955122888
; local port, the same as invite.url in telegram.properties
port = 8791
; any long random string, the same as invite.token in telegram.properties
token = change_me_to_a_long_random_string
; protection from being treated as mass mailing
daily_limit = 30
min_interval_sec = 30
