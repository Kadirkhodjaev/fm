# MySQL 5.0 (32-bit) for MedOnline - tuned my.ini
# Server: 32 GB RAM, i7-7700 (4 cores / 8 threads), SSD + HDD. Database ~4.3 GB, all tables InnoDB.
# Changed values are marked "MedOnline". Everything else is the same as the original my.ini.
#
# IMPORTANT: this mysqld is a 32-bit process (Program Files (x86)), it can use only ~2 GB of memory in total.
# That is why the InnoDB buffer pool is 1 GB here and not 10+ GB. See README.md about moving to 64-bit.

[client]

port=3306

[mysql]

default-character-set=utf8

[mysqldump]
# MedOnline: nightly dump streams rows instead of loading whole tables into memory
quick
max_allowed_packet=64M

[mysqld]

port=3306
basedir="C:/Program Files (x86)/MySQL/MySQL Server 5.0/"
datadir="C:/Program Files (x86)/MySQL/MySQL Server 5.0/Data/"
default-character-set=utf8
default-storage-engine=INNODB
sql-mode="STRICT_TRANS_TABLES,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION"

# MedOnline: the application pool (c3p0) uses at most 30 connections; 300 only reserved memory per thread
max_connections=100

# MedOnline: larger packets for big forms and long texts (default 1M)
max_allowed_packet=16M

query_cache_size=0

# MedOnline: ~200 tables, Opened_tables keeps growing with 256
table_cache=1024

# MedOnline: 13% of temporary tables went to disk with 18M; in-memory limit is the smaller of these two
tmp_table_size=64M
max_heap_table_size=64M

# MedOnline: reuse threads instead of creating new ones
thread_cache_size=32

#*** MyISAM Specific options (only system tables and on-disk temporary tables use MyISAM)
myisam_max_sort_file_size=100G
myisam_max_extra_sort_file_size=100G
myisam_sort_buffer_size=35M
key_buffer_size=32M

# MedOnline: per-thread buffers for sorting / joins / scans in reports (allocated only when needed)
read_buffer_size=1M
read_rnd_buffer_size=1M
sort_buffer_size=2M
join_buffer_size=2M

#*** INNODB Specific options ***

innodb_additional_mem_pool_size=16M

# 1 = every commit is written to disk (safe). Keep 1 for medical data unless the server has a UPS.
innodb_flush_log_at_trx_commit=1

# MedOnline: was 1M
innodb_log_buffer_size=8M

# MedOnline: was 47M (!) - only 1% of the database fit in memory, everything else was read from disk.
# 1024M is the safe maximum for 32-bit mysqld. If the service does not start, use 900M.
innodb_buffer_pool_size=1024M

# Log file size. Do NOT change it without the procedure in README.md (old ib_logfile* must be moved away),
# otherwise MySQL will not start. Recommended after the procedure: 256M.
innodb_log_file_size=24M

# MedOnline: 4 cores x 2
innodb_thread_concurrency=8

# MedOnline: was 4 - more parallel disk reads/writes on Windows
innodb_file_io_threads=8

innodb_lock_wait_timeout=50

log_error="C:/mysql_logs/mysql_error.log"

log_slow_queries="C:/mysql_logs/mysql-slow.log"
long_query_time=2
# MedOnline: was 1 - wrote every small query without an index (even 1 ms ones) to the slow log,
# the log grew fast and the disk was busy writing it. Only really slow queries are logged now.
# log_queries_not_using_indexes=1
