# Patient mobile app API (/api/m/v1). Values are re-read every minute.

# tokens: access token in minutes, refresh token in days
mobile.access.minutes=60
mobile.refresh.days=90
# login code: lifetime in minutes, codes per hour per phone, wrong codes per hour before a one-hour lock
mobile.code.minutes=5
mobile.code.per.hour=3
mobile.code.fails.per.hour=5
# links to result PDF / discharge summary, minutes
mobile.file.minutes=10
# Y = the code is NOT sent, it is returned in the /auth/code response. Only for testing on your own computer, never on the server!
mobile.debug.code=N

# home treatment after discharge: default reminder times (the patient can change them in the app profile)
home.time.morning=08:00
home.time.noon=13:00
home.time.evening=20:00
# reminder about the follow-up visit, the day before
home.time.followup=10:00

# SMS provider for login codes (not chosen yet: Eskiz, Playmobile...). Empty = codes only through the patient Telegram bot
sms.provider=
# Firebase Cloud Messaging: path to the clinic's service account json (push step). Empty = reminders go to Telegram
fcm.service.account=
